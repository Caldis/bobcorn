<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changelog — Bobcorn</title>
    <meta name="description" content="Full version history and release notes for Bobcorn.">
    <meta name="theme-color" content="#fafafa">
    <link rel="icon" type="image/png" href="/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/assets/site.css">
    <style>
        .prose { max-width: 720px; margin: 0 auto; }
        .prose .lead { margin: var(--space-md) 0 0; }

        /* ─── Changelog list (JS-rendered — class names below match renderChangelog() in script) ─── */
        .changelog { margin-top: var(--space-2xl); }

        .changelog-entry {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: var(--space-xl);
            padding: var(--space-xl) 0;
            border-top: 1px solid var(--hairline);
        }

        .changelog-meta {
            position: sticky;
            top: calc(var(--header-height) + var(--space-md));
            align-self: start;
        }

        .changelog-version {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--ink);
            background: var(--canvas-soft-2);
            letter-spacing: -0.28px;
            padding: 2px var(--space-xs);
            border-radius: var(--rounded-full);
            margin-bottom: var(--space-xs);
        }

        .changelog-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--mute);
        }

        .changelog-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            padding-top: var(--space-xxs);
        }

        .changelog-items li {
            font-size: 15px;
            color: var(--body);
            line-height: 1.6;
            padding-left: 20px;
            position: relative;
        }

        .changelog-items li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 6px;
            height: 6px;
            border-radius: var(--rounded-full);
            background: var(--ink);
            opacity: 0.35;
        }

        /* ─── Language switcher (nav-scale ghost button) ─── */
        .lang-trigger {
            position: relative;
            gap: var(--space-xxs);
        }
        .lang-trigger svg { width: 15px; height: 15px; opacity: 0.6; }

        .lang-popover {
            position: absolute;
            top: calc(100% + var(--space-xs));
            right: 0;
            background: var(--canvas);
            border-radius: var(--rounded-lg);
            padding: var(--space-md) var(--space-lg);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px 28px;
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-l5), var(--shadow-ring);
            z-index: 200;
            min-width: 300px;
        }

        .lang-popover.open {
            opacity: 1; transform: translateY(0); pointer-events: auto;
        }

        .lang-popover a {
            font-family: var(--font-sans);
            font-size: 13px;
            color: var(--body);
            text-decoration: none;
            padding: 7px var(--space-xs);
            border-radius: var(--rounded-sm);
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            white-space: nowrap;
        }

        .lang-popover a:hover { color: var(--ink); background: var(--canvas-soft-2); }
        .lang-popover a.active { color: var(--link); }

        @media (max-width: 680px) {
            .changelog-entry { grid-template-columns: 1fr; gap: var(--space-sm); }
            .changelog-meta { position: static; }
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H1DCS6LF3S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H1DCS6LF3S');
    </script>
</head>
<body>

  <nav class="site-nav"><div class="site-nav__inner">
    <a class="site-nav__brand" href="/"><img src="/icon.png" alt="Bobcorn app icon" width="24" height="24">Bobcorn</a>
    <div class="site-nav__links">
      <a class="nav-link" href="/wiki/">Wiki</a>
      <a class="nav-link" href="/developers/">Developers</a>
      <a class="nav-link" href="/contact">Contact</a>
      <a class="nav-link" href="https://github.com/Caldis/bobcorn">GitHub</a>
      <button class="lang-trigger nav-cta nav-cta--ghost" id="langTrigger" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span id="langLabel">EN</span>
          <div class="lang-popover" id="langPopover"></div>
      </button>
      <a class="nav-cta nav-cta--primary" href="https://github.com/Caldis/bobcorn/releases/latest">Download</a>
    </div>
  </div></nav>

  <main>
    <div class="band band--hero">
      <div class="mesh-gradient"></div>
      <div class="container">
        <div class="prose">
          <p class="eyebrow" data-i18n="changelog.title">Changelog</p>
          <h1 class="t-display-lg" data-i18n="changelog.fullTitle">Changelog</h1>
          <p class="t-body-lg lead" data-i18n="changelog.fullDesc">All updates and improvements across every release.</p>
        </div>
      </div>
    </div>

    <div class="band">
      <div class="container">
        <div class="prose">
          <div class="changelog" id="changelogList"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><div class="site-footer__inner">
    <div class="site-footer__brand">Bobcorn</div>
    <div class="site-footer__links" style="display:flex; gap: var(--space-lg); flex-wrap: wrap;">
      <a href="https://github.com/Caldis/bobcorn/releases">Releases</a>
      <a href="/about.html">About</a>
      <a href="/contact">Contact</a>
      <a href="https://github.com/Caldis/bobcorn">GitHub</a>
      <a href="/privacy.html">Privacy Policy</a>
    </div>
  </div></footer>

    <script>
    var LANGS = [
        { code: 'en',    label: 'English' },
        { code: 'zh-CN', label: '简体中文' },
        { code: 'zh-TW', label: '繁體中文' },
        { code: 'zh-HK', label: '繁體中文(港)' },
        { code: 'ja',    label: '日本語' },
        { code: 'ko',    label: '한국어' },
        { code: 'fr',    label: 'Français' },
        { code: 'de',    label: 'Deutsch' },
        { code: 'es',    label: 'Español' },
        { code: 'pt-BR', label: 'Português' },
        { code: 'it',    label: 'Italiano' },
        { code: 'nl',    label: 'Nederlands' },
        { code: 'ru',    label: 'Русский' },
        { code: 'tr',    label: 'Türkçe' },
        { code: 'ar',    label: 'العربية' },
        { code: 'th',    label: 'ไทย' },
        { code: 'vi',    label: 'Tiếng Việt' },
        { code: 'id',    label: 'Indonesia' }
    ];

    var currentLang = 'en';
    var loadedStrings = {};
    var changelogEntries = [];

    function detectLang() {
        var params = new URLSearchParams(location.search);
        if (params.has('lang')) return params.get('lang');
        var saved = localStorage.getItem('site-language');
        if (saved) return saved;
        var nav = (navigator.language || '').toLowerCase();
        if (nav.startsWith('zh')) {
            if (nav === 'zh-tw' || nav === 'zh-hant') return 'zh-TW';
            if (nav === 'zh-hk') return 'zh-HK';
            return 'zh-CN';
        }
        var base = nav.split('-')[0];
        var match = LANGS.find(function(l) { return l.code.toLowerCase().startsWith(base); });
        return match ? match.code : 'en';
    }

    function loadLang(lang) {
        if (loadedStrings[lang]) return Promise.resolve(loadedStrings[lang]);
        var cached = sessionStorage.getItem('i18n-' + lang);
        if (cached) { loadedStrings[lang] = JSON.parse(cached); return Promise.resolve(loadedStrings[lang]); }
        return fetch('locales/' + lang + '.json')
            .then(function(r) { return r.json(); })
            .then(function(s) { loadedStrings[lang] = s; sessionStorage.setItem('i18n-' + lang, JSON.stringify(s)); return s; });
    }

    function renderChangelog(lang) {
        var container = document.getElementById('changelogList');
        if (!container || !changelogEntries.length) return;
        var lk = lang.startsWith('zh') ? 'zh' : 'en';

        container.innerHTML = '';
        changelogEntries.forEach(function(entry) {
            var items = (entry.changes && (entry.changes[lk] || entry.changes.en)) || [];
            var el = document.createElement('div');
            el.className = 'changelog-entry';
            el.innerHTML =
                '<div class="changelog-meta">' +
                    '<div class="changelog-version">' + entry.version + '</div>' +
                    '<div class="changelog-date">' + entry.date + '</div>' +
                '</div>' +
                '<ul class="changelog-items">' +
                    items.map(function(t) { return '<li>' + t + '</li>'; }).join('') +
                '</ul>';
            container.appendChild(el);
        });
    }

    function applyLang(lang) {
        return loadLang(lang).then(function(strings) {
            currentLang = lang;
            localStorage.setItem('site-language', lang);

            var url = new URL(location.href);
            if (lang === 'en') url.searchParams.delete('lang');
            else url.searchParams.set('lang', lang);
            history.replaceState(null, '', url);

            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (strings[key]) el.textContent = strings[key];
            });

            if (strings['meta.title']) document.title = (strings['changelog.fullTitle'] || 'Changelog') + ' — Bobcorn';

            var entry = LANGS.find(function(l) { return l.code === lang; });
            var label = document.getElementById('langLabel');
            if (label && entry) label.textContent = entry.label;

            document.querySelectorAll('.lang-popover a[data-lang]').forEach(function(a) {
                a.classList.toggle('active', a.getAttribute('data-lang') === lang);
            });

            renderChangelog(lang);
        }).catch(function() {});
    }

    // Build language popover
    var popover = document.getElementById('langPopover');
    LANGS.forEach(function(l) {
        var a = document.createElement('a');
        a.href = '#';
        a.setAttribute('data-lang', l.code);
        a.textContent = l.label;
        a.addEventListener('click', function(e) {
            e.preventDefault();
            applyLang(l.code);
            popover.classList.remove('open');
        });
        popover.appendChild(a);
    });

    document.getElementById('langTrigger').addEventListener('click', function(e) {
        e.stopPropagation();
        popover.classList.toggle('open');
    });
    document.addEventListener('click', function() { popover.classList.remove('open'); });

    // Load changelog data, then apply language
    fetch('changelog.json', { cache: 'no-cache' })
        .then(function(r) { return r.json(); })
        .then(function(entries) {
            changelogEntries = entries;
            applyLang(detectLang());
        })
        .catch(function() {
            applyLang(detectLang());
        });
    </script>

</body>
</html>
